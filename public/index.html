<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>杜博夫赛事系统</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><polygon points='4,4 28,4 28,20 16,30 4,20' fill='%23ffb454'/></svg>">
<link rel="stylesheet" href="/vendor/fontsource/chakra-petch/500.css">
<link rel="stylesheet" href="/vendor/fontsource/chakra-petch/600.css">
<link rel="stylesheet" href="/vendor/fontsource/chakra-petch/700.css">
<link rel="stylesheet" href="/vendor/fontsource/jetbrains-mono/400.css">
<link rel="stylesheet" href="/vendor/fontsource/jetbrains-mono/600.css">
<link rel="stylesheet" href="/vendor/fontsource/noto-sans-sc/400.css">
<link rel="stylesheet" href="/vendor/fontsource/noto-sans-sc/500.css">
<link rel="stylesheet" href="/vendor/fontsource/noto-sans-sc/700.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="scanlines" aria-hidden="true"></div>

<header class="cmdbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><polygon points="4,4 28,4 28,20 16,30 4,20" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="16" cy="14" r="4" fill="currentColor"/></svg>
    <div class="brand-text">
      <strong id="brand-name">DUBOV // 赛事系统</strong>
      <span id="brand-sub">STANDINGS · PAIRINGS · LIVE</span>
    </div>
  </div>
  <nav class="stepper" id="stepper" aria-label="赛程阶段"></nav>
  <div class="cmdbar-actions">
    <button class="btn btn-ghost btn-sm" id="btn-undo" title="撤销上一步操作" hidden>↩ 撤销</button>
    <div class="conn" id="conn"><i class="led led-off"></i><span>离线</span></div>
    <div id="user-box"></div>
  </div>
</header>

<div class="layout">
  <nav class="rail" id="rail">
    <a href="#/me" data-route="me" data-perm="player"><i>00</i>我的比赛</a>
    <a href="#/setup" data-route="setup" data-perm="admin"><i>01</i>赛前设置</a>
    <a href="#/swiss" data-route="swiss"><i>02</i>瑞士轮</a>
    <a href="#/knockout" data-route="knockout"><i>03</i>淘汰赛</a>
    <a href="#/board" data-route="board" class="board-link"><i>04</i>排名大屏</a>
    <a href="#/help" data-route="help"><i>?</i>使用说明</a>
    <div class="rail-foot">
      <div class="rail-rule"></div>
      <p>杜博夫系统<br>6轮瑞士轮 BO1<br>8强车轮战 BO3</p>
    </div>
  </nav>
  <main class="view" id="view" tabindex="-1"></main>
</div>

<div class="toasts" id="toasts"></div>

<div class="login-mask" id="login-mask" hidden>
  <div class="login-box corner">
    <div class="phead"><h2>裁判登录</h2><span class="sub">REFEREE ACCESS</span></div>
    <div class="field"><label>用户名</label><input type="text" id="lg-name" autocomplete="username"></div>
    <div class="field mt"><label>密码</label><input type="password" id="lg-pass" autocomplete="current-password"></div>
    <div class="lg-err red" id="lg-err" hidden></div>
    <div class="flex mt" style="margin-top:18px">
      <button class="btn btn-primary grow" id="lg-go">登录</button>
      <button class="btn" id="lg-cancel">取消</button>
    </div>
    <p class="hint mt">账号由管理员统一发放，不开放注册。观众无需登录即可观看排名。</p>
  </div>
</div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
