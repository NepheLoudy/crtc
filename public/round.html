<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRTC · 渲染导出</title>
<style>
  body { margin: 0; background: #e9e9e9; display: flex; flex-direction: column; align-items: center; padding: 24px 12px 48px; }
  .toolbar { width: 940px; max-width: 100%; display: flex; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .toolbar .grp { display: flex; gap: 8px; }
  .toolbar a, .toolbar button {
    font: 700 13px/1 "Segoe UI", "Microsoft YaHei", sans-serif; color: #111; text-decoration: none;
    background: #fff; border: 2px solid #111; padding: 9px 16px; cursor: pointer;
  }
  .toolbar button.on { background: #FFD400; }
  .toolbar a:hover, .toolbar button:not(.on):hover { background: #FFD400; }
  @media print { .toolbar { display: none; } body { padding: 0; background: #fff; } }
</style>
</head>
<body>
  <div class="toolbar">
    <div class="grp">
      <button id="tab-round" class="on">本轮对阵</button>
      <button id="tab-standings">实时排名</button>
    </div>
    <div class="grp">
      <a href="/">← 返回系统</a>
      <button id="btn-png">⬇ 保存为图片</button>
    </div>
  </div>
  <div id="card"></div>
  <script type="module">
    import { batchWindow, windowSummary, fullTimetable, venueOf } from '/js/schedule.js';

    const Y = '#FFD400', K = '#111111', INK = '#2b2b2b';
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const fmtAro = (x) => (Math.round(x * 100) / 100).toFixed(2);

    // 正版方形 logo 转 data URI（PNG 导出时 foreignObject 只认内联图）
    const logoDataUri = await fetch('/crtc-logo.jpg').then((r) => r.blob())
      .then((b) => new Promise((res) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(b); }));

    const CARD_CSS = `
      #card { width: 940px; max-width: 100%; box-sizing: border-box; background: #ffffff; color: ${K}; border: 1px solid ${K}; font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; }
      #card * { box-sizing: border-box; }
      #card .brand { height: 14px; background: ${Y}; border-bottom: 2px solid ${K}; }
      #card .inner { padding: 26px 32px 0; }
      #card .head { display: flex; align-items: center; justify-content: space-between; border-bottom: 4px solid ${K}; padding-bottom: 16px; }
      #card .head img.logo { width: 96px; height: 96px; border: 2px solid ${K}; flex: none; }
      #card .head .title { font-size: 40px; font-weight: 900; letter-spacing: 3px; line-height: 1; }
      #card .head .sub { font-size: 13px; font-weight: 700; letter-spacing: 2px; margin-top: 8px; color: ${INK}; }
      #card .meta { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 700; margin: 12px 0 14px; color: ${INK}; }
      #card table { width: 100%; border-collapse: collapse; }
      #card th { background: ${Y}; color: ${K}; font-size: 12.5px; letter-spacing: 2px; padding: 9px 10px; text-align: left; border-bottom: 3px solid ${K}; }
      #card td { border-bottom: 2px solid ${K}; padding: 9px 10px; font-size: 15px; font-weight: 600; vertical-align: middle; background: #fff; }
      #card tr:last-child td { border-bottom: 3px solid ${K}; }
      #card .bd { font-family: Consolas, monospace; font-size: 17px; font-weight: 700; width: 52px; }
      #card .tw { white-space: nowrap; font-family: Consolas, monospace; font-size: 13px; font-weight: 400; width: 168px; color: ${INK}; }
      #card .va, #card .vb { width: 240px; }
      #card .va b { color: #c0392b; }
      #card .vb b { color: #2c5fb8; }
      #card .va i, #card .vb i { display: block; font-style: normal; font-family: Consolas, monospace; font-weight: 400; font-size: 11px; color: ${INK}; }
      #card .vs { text-align: center; font-family: Consolas, monospace; font-weight: 700; white-space: nowrap; }
      #card .vb { text-align: right; } #card .vb i { text-align: right; }
      #card .tg { text-align: right; white-space: nowrap; }
      #card .tag { display: inline-block; font-size: 10.5px; font-weight: 800; padding: 3px 7px; margin-left: 4px; border: 2px solid ${K}; background: #fff; color: ${K}; }
      #card .tag.solid { background: ${K}; color: ${Y}; }
      #card tr.bye td { border-bottom: 2px dashed ${K}; color: ${INK}; background: #fff; }
      #card tr.top8 td { background: #FFF6CC; }
      #card tr.top8 td:first-child { box-shadow: inset 5px 0 0 ${Y}; }
      #card .tt { margin-top: 18px; }
      #card .tt h3 { margin: 0 0 8px; font-size: 14px; letter-spacing: 2px; }
      #card .tt .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px 10px; font-family: Consolas, monospace; font-size: 11.5px; font-weight: 700; }
      #card .tt .cell { border: 2px solid ${K}; padding: 4px 8px; display: flex; justify-content: space-between; background: #fff; }
      #card .tt .cell.seg2 { background: ${Y}; }
      #card .foot { display: flex; justify-content: space-between; align-items: center; background: ${K}; color: #fff; margin: 24px -32px 0; padding: 12px 32px; font-size: 12px; letter-spacing: 2px; font-weight: 700; }
      #card .vhead { display: flex; align-items: baseline; justify-content: space-between; padding: 7px 12px; margin: 18px 0 0; font-size: 16px; font-weight: 900; letter-spacing: 2px; background: ${K}; color: ${Y}; }
      #card .vhead .vmark { display: inline-block; width: 12px; height: 12px; margin-right: 8px; }
      #card .vhead.vA .vmark { background: ${Y}; }
      #card .vhead.vB .vmark { background: transparent; border: 3px solid ${Y}; }
      #card .vhead.vB { border-top: 4px solid ${K}; }
      #card .vhead .vs-sub { font-size: 11px; font-weight: 700; letter-spacing: 1px; }
      #card .rk { font-family: Consolas, monospace; font-size: 19px; font-weight: 700; width: 56px; }
      #card .score { font-size: 18px; font-weight: 900; }
    `;

    const st = await (await fetch('/api/state')).json();
    const card = document.getElementById('card');
    if (!st.hasTournament) { card.innerHTML = '<p style="font:14px sans-serif">尚未创建赛事</p>'; throw new Error('no tournament'); }
    const nameOf = (id) => { const t = st.state.teams.find((x) => x.id === id); return t ? t.name : id; };

    function headHtml(title, sub) {
      return `<div class="head">
        <div><div class="title">${title}</div><div class="sub">${sub}</div></div>
        <img class="logo" src="${logoDataUri}" alt="CRTC">
      </div>`;
    }
    function footHtml() {
      return `<div class="foot"><span>${esc(st.state.meta.name)} · CRTC × DUBOV 赛事系统</span><span>生成于 ${new Date().toLocaleString('zh-CN', { hour12: false })}</span></div>`;
    }

    // ---------- 对阵卡（A/B 场分区块；?venue=A|B 可只渲染单场地） ----------
    function roundCard(venueFilter) {
      const pending = st.pending;
      const round = pending || [...st.state.swiss.rounds].reverse().find((r) => r.committed);
      if (!round) return `<div class="head"><div class="title">暂无对阵</div></div><p style="font-weight:700;padding-bottom:20px">请先在系统中生成本轮对阵。</p>${footHtml()}`;
      const total = round.pairings.length;
      const promoted = new Set(round.promoted || []);
      const demoted = new Set(round.demoted || []);
      const tagOf = (id) => promoted.has(id) ? '<em class="tag">上调</em>' : demoted.has(id) ? '<em class="tag">下调</em>' : '';
      const rowHtml = (p) => {
        const w = batchWindow(round.round, p.board, total);
        const wo = p.walkover ? `<em class="tag solid">${st.state.teams.find((t) => t.id === p.a)?.suspended || st.state.teams.find((t) => t.id === p.b)?.suspended ? '停赛判负' : '弃赛判负'}</em>` : '';
        const tags = `${tagOf(p.a)}${tagOf(p.b)}${p.rematchOf ? '<em class="tag solid">重赛·第' + p.rematchOf + '轮</em>' : ''}${p.rematchDefer ? '<em class="tag solid">暂记平局·下轮重赛</em>' : ''}${wo}`;
        const res = p.result === 'a' ? '1:0' : p.result === 'b' ? '0:1' : p.result === 'draw' ? '½:½' : 'VS';
        return `<tr>
          <td class="bd">${String(p.board).padStart(2, '0')}</td>
          <td class="tw">批次${String(w.batch).padStart(2, '0')} · ${w.day}<br>${w.start}–${w.end}</td>
          <td class="va"><b>${esc(nameOf(p.a))}</b><i>ARO ${fmtAro(p.aroA)}</i></td>
          <td class="vs">${res}</td>
          <td class="vb"><b>${esc(nameOf(p.b))}</b><i>ARO ${fmtAro(p.aroB)}</i></td>
          <td class="tg">${tags}</td>
        </tr>`;
      };

      const hasB = total > 16;
      const ranges = [];
      if (!venueFilter || venueFilter === 'A' || !hasB) ranges.push({ key: 'A', lo: 1, hi: Math.min(16, total) });
      if (hasB && (!venueFilter || venueFilter === 'B')) ranges.push({ key: 'B', lo: 17, hi: total });
      let byeLeft = round.bye; // 轮空行放在第一个渲染的场地区块末尾
      const sections = ranges.map(({ key, lo, hi }) => {
        const ps = round.pairings.filter((p) => p.board >= lo && p.board <= hi).sort((a, b) => a.board - b.board);
        const byeRow = byeLeft ? `<tr class="bye">
          <td class="bd">—</td><td class="tw">轮空</td>
          <td class="va" colspan="3"><b>${esc(nameOf(byeLeft))}</b><i>本轮 ARO 项 = 除本组外对手均值 ${fmtAro(round.byeTerm ?? 0)}（条款 5.3.1）</i></td>
          <td class="tg"></td></tr>` : '';
        byeLeft = null;
        return `<div class="vhead v${key}"><b><i class="vmark"></i>${key} 场</b><span class="vs-sub">局号 ${String(lo).padStart(2, '0')}–${String(hi).padStart(2, '0')} · 每批 1 局</span></div>
        <table>
          <thead><tr><th>局号</th><th>批次 / 时间</th><th style="text-align:right;color:#c0392b">红方</th><th style="text-align:center">结果</th><th style="color:#2c5fb8">蓝方</th><th style="text-align:right">标记</th></tr></thead>
          <tbody>${ps.map(rowHtml).join('')}${byeRow}</tbody>
        </table>`;
      }).join('');
      const tt = fullTimetable(round.round).map((b) =>
        `<span class="cell ${b.seg === '后段' ? 'seg2' : ''}"><span>批次${String(b.batch).padStart(2, '0')}</span><span>${b.start}–${b.end}</span></span>`).join('');
      const venueNote = hasB ? ' · A/B 两场地并行开打（每批各一局）' : '';
      const title = `第 ${round.round} 轮对阵${venueFilter && hasB ? ' · ' + venueFilter + ' 场' : ''}`;
      return `<div class="brand"></div><div class="inner">
      ${headHtml(title, `PAIRINGS · ${total} 局`)}
      <div class="meta">
        <span>${esc(st.state.meta.name)} · 瑞士轮 ${st.swissProgress.done}/${st.swissProgress.total}${pending ? ' · 待录入' : ' · 已确认'}${venueNote}</span>
        <span>${windowSummary(round.round, total)}</span>
      </div>
      ${sections}
      <div class="tt"><h3>本批次时间总表（每 19 分钟一批 · 打 9 分钟歇 10 分钟 · 两场地同时制）</h3><div class="grid">${tt}</div></div>
      ${footHtml()}</div>`;
    }

    // ---------- 排名卡 ----------
    function standingsCard() {
      const rows = st.standings.filter((r) => !r.withdrawn && !r.suspended);
      const trs = rows.map((r) => `<tr class="${r.rank <= 8 ? 'top8' : ''}">
          <td class="rk">${String(r.rank).padStart(2, '0')}</td>
          <td><b>${esc(r.team.name)}</b></td>
          <td class="score">${fmtAro(r.score)}</td>
          <td>${fmtAro(r.aro)}</td>
          <td style="font-family:Consolas,monospace">${r.wins}-${r.draws}-${r.losses}</td>
          <td style="font-family:Consolas,monospace">${r.byes ? '+' + r.byes : '—'}</td>
        </tr>`).join('');
      return `<div class="brand"></div><div class="inner">
      ${headHtml('实时排名', `STANDINGS · ${rows.length} 队`)}
      <div class="meta">
        <span>${esc(st.state.meta.name)} · 瑞士轮 ${st.swissProgress.done}/${st.swissProgress.total} · 排序：积分 → ARO（条款 5.1/5.2）</span>
        <span>黄底纹 = 前 8 淘汰赛录取线（条款 5.2）</span>
      </div>
      <table>
        <thead><tr><th>名次</th><th>队伍</th><th>积分</th><th>ARO</th><th>胜-平-负</th><th>轮空</th></tr></thead>
        <tbody>${trs}</tbody>
      </table>
      ${footHtml()}</div>`;
    }

    const tabs = { round: () => roundCard(new URLSearchParams(location.search).get('venue')), standings: standingsCard };
    let current = 'round';
    function show(tab) {
      current = tab;
      card.innerHTML = `<style>${CARD_CSS}</style>` + tabs[tab]();
      document.getElementById('tab-round').classList.toggle('on', tab === 'round');
      document.getElementById('tab-standings').classList.toggle('on', tab === 'standings');
      const name = st.state.meta.name;
      document.title = tab === 'round'
        ? (st.pending ? `${name} 第${st.pending.round}轮对阵` : `${name} 对阵`)
        : `${name} 实时排名`;
    }
    show(new URLSearchParams(location.search).get('tab') === 'standings' ? 'standings' : 'round');
    document.getElementById('tab-round').addEventListener('click', () => show('round'));
    document.getElementById('tab-standings').addEventListener('click', () => show('standings'));

    document.getElementById('btn-png').addEventListener('click', async () => {
      const w = card.offsetWidth, h = card.offsetHeight, dpr = 2;
      const xml = new XMLSerializer().serializeToString(card);
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><foreignObject width="100%" height="100%">${xml}</foreignObject></svg>`;
      const img = new Image();
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('渲染失败，请改用截图或 Ctrl+P 打印')); });
      const c = document.createElement('canvas');
      c.width = w * dpr; c.height = h * dpr;
      const ctx = c.getContext('2d');
      ctx.scale(dpr, dpr);
      ctx.drawImage(img, 0, 0, w, h);
      c.toBlob((b) => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = `${st.state.meta.name}${document.title.replace(st.state.meta.name, '')}.png`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      }, 'image/png');
    });
  </script>
</body>
</html>
