<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRTC · 渲染导出</title>
<style>
  body { margin: 0; background: #2b2b2b; display: flex; flex-direction: column; align-items: center; padding: 24px 12px 48px; }
  .toolbar { width: 940px; max-width: 100%; display: flex; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .toolbar .grp { display: flex; gap: 8px; }
  .toolbar a, .toolbar button {
    font: 700 13px/1 "Arial Black", "Microsoft YaHei", sans-serif; color: #FFD400; text-decoration: none;
    background: #1c1c1c; border: 2px solid #FFD400; padding: 10px 16px; cursor: pointer;
  }
  .toolbar button.on { background: #FFD400; color: #111; }
  .toolbar button:not(.on):hover, .toolbar a:hover { background: #333; }
  @media print { .toolbar { display: none; } body { padding: 0; background: #FFD400; } }
</style>
</head>
<body>
  <div class="toolbar">
    <div class="grp">
      <button id="tab-round" class="on">本轮对阵</button>
      <button id="tab-standings">实时排名</button>
    </div>
    <div class="grp">
      <a href="/">← 返回系统</a>
      <button id="btn-png">⬇ 保存为图片</button>
    </div>
  </div>
  <div id="card"></div>
  <script type="module">
    import { batchWindow, windowSummary, fullTimetable } from '/js/schedule.js';

    const YELLOW = '#FFD400', BLACK = '#111111', INK = '#2b2b2b';
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const fmtAro = (x) => (Math.round(x * 100) / 100).toFixed(2);

    // CRTC 标志母题：错位双黑方块 + 棋盘圆（近似复刻视觉规范）
    const logoSvg = (size = 64) => `
      <svg class="logo" width="${size}" height="${size}" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <rect x="22" y="8" width="42" height="42" fill="${BLACK}"/>
        <rect x="56" y="70" width="42" height="42" fill="${BLACK}"/>
        <circle cx="60" cy="60" r="21" fill="${YELLOW}"/>
        <path d="M60 39 A21 21 0 0 1 81 60 L60 60 Z" fill="${BLACK}"/>
        <path d="M60 81 A21 21 0 0 1 39 60 L60 60 Z" fill="${BLACK}"/>
        <path d="M60 47 A13 13 0 0 0 47 60 L60 60 Z" fill="${BLACK}"/>
        <path d="M60 73 A13 13 0 0 0 73 60 L60 60 Z" fill="${BLACK}"/>
      </svg>`;

    const CARD_CSS = `
      #card { width: 940px; max-width: 100%; box-sizing: border-box; background: ${YELLOW}; color: ${BLACK}; padding: 34px 36px 0; font-family: "Arial Black", "Microsoft YaHei", "PingFang SC", sans-serif; }
      #card * { box-sizing: border-box; }
      #card .head { display: flex; align-items: center; justify-content: space-between; border-bottom: 4px solid ${BLACK}; padding-bottom: 14px; }
      #card .head .title { font-size: 40px; font-weight: 900; letter-spacing: 3px; line-height: 1; }
      #card .head .sub { font-size: 13px; font-weight: 700; letter-spacing: 2px; margin-top: 6px; color: ${INK}; }
      #card .meta { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 700; margin: 12px 0 14px; color: ${INK}; }
      #card table { width: 100%; border-collapse: collapse; }
      #card th { background: ${BLACK}; color: ${YELLOW}; font-size: 12.5px; letter-spacing: 2px; padding: 9px 10px; text-align: left; }
      #card td { border-bottom: 2px solid ${BLACK}; padding: 9px 10px; font-size: 15px; font-weight: 700; vertical-align: middle; }
      #card tr:last-child td { border-bottom: 4px solid ${BLACK}; }
      #card .bd { font-family: Consolas, monospace; font-size: 17px; width: 52px; }
      #card .tw { white-space: nowrap; font-family: Consolas, monospace; font-size: 13px; width: 170px; color: ${INK}; }
      #card .va, #card .vb { width: 240px; }
      #card .va i, #card .vb i { display: block; font-style: normal; font-family: Consolas, monospace; font-weight: 400; font-size: 11px; color: ${INK}; }
      #card .vs { text-align: center; font-family: Consolas, monospace; white-space: nowrap; }
      #card .vb { text-align: right; } #card .vb i { text-align: right; }
      #card .tg { text-align: right; white-space: nowrap; }
      #card .tag { display: inline-block; font-size: 10.5px; font-weight: 900; padding: 3px 7px; margin-left: 4px; border: 2px solid ${BLACK}; }
      #card .tag.solid { background: ${BLACK}; color: ${YELLOW}; }
      #card .bye td { border-bottom: 2px dashed ${BLACK}; background: rgba(0,0,0,.06); }
      #card .tt { margin-top: 18px; border-top: 4px solid ${BLACK}; padding-top: 12px; }
      #card .tt h3 { margin: 0 0 8px; font-size: 14px; letter-spacing: 2px; }
      #card .tt .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px 10px; font-family: Consolas, monospace; font-size: 11.5px; font-weight: 700; }
      #card .tt .cell { border: 2px solid ${BLACK}; padding: 4px 8px; display: flex; justify-content: space-between; }
      #card .tt .cell.seg2 { background: rgba(0,0,0,.08); }
      #card .foot { display: flex; justify-content: space-between; align-items: center; background: ${BLACK}; color: ${YELLOW}; margin: 22px -36px 0; padding: 12px 36px; font-size: 12px; letter-spacing: 2px; font-weight: 700; }
      #card .rk { font-family: Consolas, monospace; font-size: 19px; width: 56px; }
      #card tr.top8 td { background: rgba(0,0,0,.10); }
      #card .score { font-size: 18px; }
    `;

    const st = await (await fetch('/api/state')).json();
    const card = document.getElementById('card');
    if (!st.hasTournament) { card.innerHTML = '<p style="color:#FFD400;font:14px sans-serif">尚未创建赛事</p>'; throw new Error('no tournament'); }
    const nameOf = (id) => { const t = st.state.teams.find((x) => x.id === id); return t ? t.name : id; };

    function headHtml(title, sub) {
      return `<div class="head">
        <div><div class="title">${title}</div><div class="sub">${sub}</div></div>
        ${logoSvg(88)}
      </div>`;
    }
    function footHtml() {
      return `<div class="foot"><span>${esc(st.state.meta.name)} · CRTC × DUBOV 赛事系统</span><span>生成于 ${new Date().toLocaleString('zh-CN', { hour12: false })}</span></div>`;
    }

    // ---------- 对阵卡 ----------
    function roundCard() {
      const pending = st.pending;
      const round = pending || [...st.state.swiss.rounds].reverse().find((r) => r.committed);
      if (!round) return `<div class="head"><div class="title">暂无对阵</div></div><p style="font-weight:700">请先在系统中生成本轮对阵。</p>${footHtml()}`;
      const total = round.pairings.length;
      const promoted = new Set(round.promoted || []);
      const demoted = new Set(round.demoted || []);
      const tagOf = (id) => promoted.has(id) ? '<em class="tag">上调</em>' : demoted.has(id) ? '<em class="tag">下调</em>' : '';
      const rows = [...round.pairings].sort((a, b) => a.board - b.board).map((p) => {
        const w = batchWindow(round.round, p.board, total);
        const wo = p.walkover ? `<em class="tag solid">${st.state.teams.find((t) => t.id === p.a)?.suspended || st.state.teams.find((t) => t.id === p.b)?.suspended ? '停赛判负' : '弃赛判负'}</em>` : '';
        const tags = `${tagOf(p.a)}${tagOf(p.b)}${p.rematchOf ? '<em class="tag solid">重赛·第' + p.rematchOf + '轮</em>' : ''}${p.rematchDefer ? '<em class="tag solid">暂记平局·下轮重赛</em>' : ''}${wo}`;
        const res = p.result === 'a' ? '1:0' : p.result === 'b' ? '0:1' : p.result === 'draw' ? '½:½' : 'VS';
        return `<tr>
          <td class="bd">${String(p.board).padStart(2, '0')}</td>
          <td class="tw">批次${String(w.batch).padStart(2, '0')} · ${w.day}<br>${w.start}–${w.end}</td>
          <td class="va"><b>${esc(nameOf(p.a))}</b><i>ARO ${fmtAro(p.aroA)}</i></td>
          <td class="vs">${res}</td>
          <td class="vb"><b>${esc(nameOf(p.b))}</b><i>ARO ${fmtAro(p.aroB)}</i></td>
          <td class="tg">${tags}</td>
        </tr>`;
      }).join('');
      const byeRow = round.bye ? `<tr class="bye">
        <td class="bd">—</td><td class="tw">轮空</td>
        <td class="va" colspan="3"><b>${esc(nameOf(round.bye))}</b><i>本轮 ARO 项 = 除本组外对手均值 ${fmtAro(round.byeTerm ?? 0)}（条款 5.3.1）</i></td>
        <td class="tg"></td></tr>` : '';
      const tt = fullTimetable(round.round).map((b) =>
        `<span class="cell ${b.seg === '后段' ? 'seg2' : ''}"><span>批次${String(b.batch).padStart(2, '0')}</span><span>${b.start}–${b.end}</span></span>`).join('');
      return `${headHtml(`第 ${round.round} 轮对阵`, `PAIRINGS · ${total} 台`)}
      <div class="meta">
        <span>${esc(st.state.meta.name)} · 瑞士轮 ${st.swissProgress.done}/${st.swissProgress.total}${pending ? ' · 待录入' : ' · 已确认'}</span>
        <span>${windowSummary(round.round, total)}</span>
      </div>
      <table>
        <thead><tr><th>台</th><th>批次 / 时间</th><th style="text-align:right">A</th><th style="text-align:center">结果</th><th>B</th><th style="text-align:right">标记</th></tr></thead>
        <tbody>${rows}${byeRow}</tbody>
      </table>
      <div class="tt"><h3>本批次时间总表（每 19 分钟一批 · 打 9 分钟歇 10 分钟）</h3><div class="grid">${tt}</div></div>
      ${footHtml()}`;
    }

    // ---------- 排名卡 ----------
    function standingsCard() {
      const rows = st.standings.filter((r) => !r.withdrawn && !r.suspended);
      const trs = rows.map((r, i) => `<tr class="${r.rank <= 8 ? 'top8' : ''}">
          <td class="rk">${String(r.rank).padStart(2, '0')}</td>
          <td><b>${esc(r.team.name)}</b></td>
          <td class="score">${fmtAro(r.score)}</td>
          <td>${fmtAro(r.aro)}</td>
          <td style="font-family:Consolas,monospace">${r.wins}-${r.draws}-${r.losses}</td>
          <td style="font-family:Consolas,monospace">${r.byes ? '+' + r.byes : '—'}</td>
        </tr>`).join('');
      return `${headHtml('实时排名', `STANDINGS · ${rows.length} 队`)}
      <div class="meta">
        <span>${esc(st.state.meta.name)} · 瑞士轮 ${st.swissProgress.done}/${st.swissProgress.total} · 排序：积分 → ARO（条款 5.1/5.2）</span>
        <span>前 8 名底纹 = 淘汰赛录取线（条款 5.2）</span>
      </div>
      <table>
        <thead><tr><th>名次</th><th>队伍</th><th>积分</th><th>ARO</th><th>胜-平-负</th><th>轮空</th></tr></thead>
        <tbody>${trs}</tbody>
      </table>
      ${footHtml()}`;
    }

    const tabs = { round: roundCard, standings: standingsCard };
    let current = 'round';
    function show(tab) {
      current = tab;
      card.innerHTML = `<style>${CARD_CSS}</style>` + tabs[tab]();
      document.getElementById('tab-round').classList.toggle('on', tab === 'round');
      document.getElementById('tab-standings').classList.toggle('on', tab === 'standings');
      const name = st.state.meta.name;
      document.title = tab === 'round'
        ? (st.pending ? `${name} 第${st.pending.round}轮对阵` : `${name} 对阵`)
        : `${name} 实时排名`;
    }
    show(new URLSearchParams(location.search).get('tab') === 'standings' ? 'standings' : 'round');
    document.getElementById('tab-round').addEventListener('click', () => show('round'));
    document.getElementById('tab-standings').addEventListener('click', () => show('standings'));

    document.getElementById('btn-png').addEventListener('click', async () => {
      const w = card.offsetWidth, h = card.offsetHeight, dpr = 2;
      const xml = new XMLSerializer().serializeToString(card);
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><foreignObject width="100%" height="100%">${xml}</foreignObject></svg>`;
      const img = new Image();
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('渲染失败，请改用截图或 Ctrl+P 打印')); });
      const c = document.createElement('canvas');
      c.width = w * dpr; c.height = h * dpr;
      const ctx = c.getContext('2d');
      ctx.scale(dpr, dpr);
      ctx.drawImage(img, 0, 0, w, h);
      c.toBlob((b) => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = `${st.state.meta.name}${document.title.replace(st.state.meta.name, '')}.png`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      }, 'image/png');
    });
  </script>
</body>
</html>
